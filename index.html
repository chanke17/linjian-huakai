<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>林间花开</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f2ede2; --ink: #3a3633; }
  html, body {
    margin: 0; height: 100%; background: var(--paper); overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #title {
    position: fixed; left: 0; right: 0; top: 36%; text-align: center; pointer-events: none;
    font-family: 'ZCOOL XiaoWei', serif; color: var(--ink);
    font-size: clamp(28px, 4.2vw, 56px); letter-spacing: .4em; padding-left: .4em;
    opacity: 0; transition: opacity 1.8s ease;
    text-shadow: 0 0 10px var(--paper), 0 0 22px var(--paper), 0 0 40px var(--paper);
  }
  #title::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: min(70vw, 720px); height: 2.6em;
    transform: translate(-50%, -50%); z-index: -1; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(242, 237, 226, .92), rgba(242, 237, 226, 0));
  }
  #title small { display: block; font-size: .32em; letter-spacing: .6em; margin-top: 1em; opacity: .65; }
  #title.show { opacity: .88; }
  #mode, #replay {
    position: fixed; bottom: calc(16px + env(safe-area-inset-bottom));
    font-family: 'ZCOOL XiaoWei', serif; font-size: 15px; color: var(--ink);
    background: rgba(242, 237, 226, .72); border: 1px solid rgba(58, 54, 51, .3);
    border-radius: 999px; padding: 8px 18px; cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity 1.2s; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    -webkit-tap-highlight-color: transparent;
  }
  #mode { left: 18px; }
  #replay { right: 18px; }
  #mode.show, #replay.show { opacity: 1; pointer-events: auto; }
  #replay:hover, #mode:hover { background: rgba(255, 252, 245, .9); }
  #hint {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom));
    transform: translateX(-50%); pointer-events: none;
    font-family: 'ZCOOL XiaoWei', serif; font-size: 15px; letter-spacing: .12em; color: var(--ink); white-space: nowrap;
    opacity: 0; transition: opacity 1.4s; text-shadow: 0 0 8px var(--paper), 0 0 16px var(--paper);
  }
  #hint.show { opacity: .85; }
  #hint kbd {
    display: inline-block; min-width: 1.4em; padding: 1px 6px; margin: 0 1px; border: 1px solid rgba(58, 54, 51, .45);
    border-bottom-width: 2px; border-radius: 5px; font: inherit; font-size: 13px; background: rgba(242, 237, 226, .8);
  }
  #stick, #jump-btn {
    display: none; position: fixed; z-index: 5; touch-action: none;
    -webkit-tap-highlight-color: transparent; opacity: 0; pointer-events: none; transition: opacity .6s;
  }
  body.touch-ui #stick.show, body.touch-ui #jump-btn.show { display: block; opacity: 1; pointer-events: auto; }
  @media (hover: none) and (pointer: coarse) {
    #stick.show, #jump-btn.show { display: block; opacity: 1; pointer-events: auto; }
  }
  #stick {
    left: 22px; bottom: calc(74px + env(safe-area-inset-bottom));
    width: 112px; height: 112px; border-radius: 50%;
    background: radial-gradient(circle, rgba(242, 237, 226, .45), rgba(242, 237, 226, .22));
    border: 1.5px solid rgba(58, 54, 51, .28);
    box-shadow: 0 2px 12px rgba(58, 54, 51, .08);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  #stick-knob {
    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px;
    margin: -22px 0 0 -22px; border-radius: 50%; pointer-events: none;
    background: rgba(58, 54, 51, .52); border: 1.5px solid rgba(242, 237, 226, .85);
    box-shadow: 0 2px 8px rgba(58, 54, 51, .2);
  }
  #jump-btn {
    right: 24px; bottom: calc(84px + env(safe-area-inset-bottom));
    width: 64px; height: 64px; border-radius: 50%;
    font-family: 'ZCOOL XiaoWei', serif; font-size: 18px; color: var(--ink);
    background: rgba(242, 237, 226, .58); border: 1.5px solid rgba(58, 54, 51, .32);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  #jump-btn:active { transform: scale(.92); background: rgba(242, 237, 226, .85); }
  @media (max-width: 960px) {
    #hint { font-size: 13px; white-space: normal; width: 88vw; text-align: center; bottom: calc(68px + env(safe-area-inset-bottom)); }
  }
  body.touch-ui #hint { top: calc(18px + env(safe-area-inset-top)); bottom: auto; width: 90vw; text-align: center; white-space: normal; font-size: 13px; }
  @media (hover: none) and (pointer: coarse) {
    #hint { top: calc(18px + env(safe-area-inset-top)); bottom: auto; width: 90vw; text-align: center; white-space: normal; font-size: 13px; }
  }

  /* ——— 奶奶家：任务、吵醒值、提示、气泡 ——— */
  #goals, #noise, #prompt, #carry, #toast, #act-btn, #endcard {
    position: fixed; z-index: 6; font-family: 'ZCOOL XiaoWei', serif; color: var(--ink);
    opacity: 0; pointer-events: none; transition: opacity .5s, transform .5s;
  }
  #goals {
    left: calc(14px + env(safe-area-inset-left)); top: calc(14px + env(safe-area-inset-top));
    background: rgba(250, 246, 236, .9); border: 1.5px solid rgba(58, 54, 51, .28); border-radius: 14px;
    padding: 10px 16px 10px 14px; max-width: min(320px, 70vw); box-shadow: 0 3px 14px rgba(58, 54, 51, .08);
  }
  #goals h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: .3em; font-weight: normal; opacity: .6; }
  #goals ul { margin: 0; padding: 0; list-style: none; font-size: 16px; line-height: 1.45; }
  #goals li { margin: 3px 0; }
  #goals li b { display: inline-block; width: 1.4em; font-weight: normal; color: #b0a495; }
  #goals li.done { color: #5f8a48; }
  #goals li.done b { color: #5f8a48; }
  #goals small { display: block; margin-left: 1.4em; font-size: 12.5px; opacity: .62; line-height: 1.35; }
  #noise {
    right: calc(14px + env(safe-area-inset-right)); top: calc(14px + env(safe-area-inset-top)); text-align: center;
    background: rgba(250, 246, 236, .86); border: 1.5px solid rgba(58, 54, 51, .22); border-radius: 999px; padding: 6px 16px 8px;
  }
  #noise span { font-size: 13px; letter-spacing: .1em; }
  #noise .bar { margin-top: 4px; width: 190px; height: 9px; border-radius: 9px; background: rgba(58, 54, 51, .12); overflow: hidden; }
  #noise .bar i { display: block; height: 100%; width: 0; border-radius: 9px; transition: width .15s, background .3s; }
  #prompt {
    left: 50%; bottom: calc(64px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(255, 252, 244, .95); border: 1.5px solid rgba(58, 54, 51, .35); border-radius: 999px;
    padding: 8px 20px; font-size: 18px; letter-spacing: .06em; white-space: nowrap; box-shadow: 0 3px 14px rgba(58, 54, 51, .12);
  }
  #prompt kbd {
    display: inline-block; min-width: 1.3em; padding: 0 6px; margin-right: 6px; border: 1.5px solid rgba(58, 54, 51, .5);
    border-bottom-width: 3px; border-radius: 6px; font: inherit; font-size: 15px; background: #fff; text-align: center;
  }
  #carry {
    left: calc(16px + env(safe-area-inset-left)); bottom: calc(64px + env(safe-area-inset-bottom));
    background: rgba(250, 246, 236, .9); border: 1.5px solid rgba(201, 71, 63, .45); border-radius: 999px; padding: 6px 14px; font-size: 15px;
  }
  #toast {
    left: 50%; top: calc(76px + env(safe-area-inset-top)); transform: translate(-50%, -6px);
    background: rgba(255, 250, 238, .95); border-radius: 14px; padding: 8px 18px; font-size: 17px; letter-spacing: .05em;
    box-shadow: 0 4px 18px rgba(58, 54, 51, .14); max-width: 86vw; text-align: center;
  }
  #toast.show { transform: translate(-50%, 0); }
  #goals.show, #noise.show, #prompt.show, #carry.show, #toast.show { opacity: 1; }
  #act-btn {
    right: calc(22px + env(safe-area-inset-right)); bottom: calc(162px + env(safe-area-inset-bottom));
    min-width: 76px; padding: 12px 16px; border-radius: 999px; font-size: 16px;
    background: rgba(255, 238, 214, .95); border: 2px solid rgba(201, 71, 63, .55); box-shadow: 0 3px 12px rgba(58, 54, 51, .15);
    -webkit-tap-highlight-color: transparent;
  }
  #act-btn.show { opacity: 1; pointer-events: auto; }
  #act-btn:active { transform: scale(.94); }
  #bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .bubble {
    position: absolute; left: 0; top: 0; max-width: 230px; padding: 7px 13px 8px; border-radius: 16px;
    font-family: 'ZCOOL XiaoWei', serif; font-size: 16px; line-height: 1.35; color: var(--ink); text-align: center;
    background: rgba(255, 253, 248, .97); border: 2px solid #9a9ca3; box-shadow: 0 3px 12px rgba(58, 54, 51, .12);
    opacity: 0; transition: opacity .25s; margin-top: -12px; white-space: normal;
  }
  .bubble::after {
    content: ''; position: absolute; left: 50%; bottom: -9px; width: 12px; height: 12px; margin-left: -6px;
    background: inherit; border: inherit; border-top: none; border-left: none; transform: rotate(45deg);
  }
  .bubble.show { opacity: 1; }
  .bubble.girl { border-color: #cf5148; }
  .bubble.grandma { border-color: #9483c4; }
  .bubble.think { border-style: dashed; border-color: #cf5148; color: #6a5a52; background: rgba(255, 250, 244, .93); }
  .bubble.zzz { background: transparent; border-color: transparent; box-shadow: none; color: #7d8592; font-size: 18px; letter-spacing: .2em; }
  .bubble.zzz::after { display: none; }
  #marker {
    position: fixed; left: 0; top: 0; z-index: 5; pointer-events: none; color: #e0614f; font-size: 26px;
    text-shadow: 0 0 6px #fff, 0 0 12px #fff; opacity: 0; transition: opacity .3s;
  }
  #marker.show { opacity: .95; }
  #fade { position: fixed; inset: 0; z-index: 8; background: var(--paper); opacity: 0; pointer-events: none; }
  #endcard {
    left: 50%; top: 50%; transform: translate(-50%, -44%); text-align: center; z-index: 7;
    background: rgba(250, 246, 236, .95); border: 1.5px solid rgba(58, 54, 51, .3); border-radius: 22px; padding: 22px 30px 24px;
    box-shadow: 0 8px 40px rgba(58, 54, 51, .18);
  }
  #endcard.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  #endcard h2 { margin: 0; font-weight: normal; font-size: 42px; letter-spacing: .3em; padding-left: .3em; }
  #endcard p { margin: 8px 0 18px; font-size: 17px; }
  #endcard .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #endcard button {
    font: inherit; font-size: 15px; color: var(--ink); background: #fff; border: 1.5px solid rgba(58, 54, 51, .35);
    border-radius: 999px; padding: 8px 16px; cursor: pointer;
  }
  #endcard button:hover { background: #fff7ea; }
  body.in-room #title { display: none; }
  @media (max-width: 780px) {
    #goals { max-width: min(200px, 50vw); padding: 8px 12px; }
    #goals h3 { font-size: 11px; margin-bottom: 4px; }
    #goals ul { font-size: 13.5px; line-height: 1.4; }
    #goals small { display: none; }
    #noise { left: auto; right: calc(14px + env(safe-area-inset-right)); transform: none; padding: 6px 12px 7px; }
    #noise span { font-size: 12px; }
    #noise .bar { width: 108px; }
    #toast { top: calc(74px + env(safe-area-inset-top)); font-size: 15px; }
    .bubble { font-size: 14px; max-width: 180px; }
  }
  body.touch-ui #prompt { bottom: calc(200px + env(safe-area-inset-bottom)); }
  body.touch-ui #carry { bottom: calc(198px + env(safe-area-inset-bottom)); }
  body.in-room.touch-ui #hint {
    top: auto; bottom: calc(18px + env(safe-area-inset-bottom));
    left: calc(16px + env(safe-area-inset-left)); transform: none;
    width: calc(100vw - 160px); text-align: left; font-size: 12.5px;
  }
  @media (hover: none) and (pointer: coarse) {
    #prompt { bottom: calc(200px + env(safe-area-inset-bottom)); }
    #carry { bottom: calc(198px + env(safe-area-inset-bottom)); }
    body.in-room #hint {
      top: auto; bottom: calc(18px + env(safe-area-inset-bottom));
      left: calc(16px + env(safe-area-inset-left)); transform: none;
      width: calc(100vw - 160px); text-align: left; font-size: 12.5px;
    }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="title">林间花开<small>颜色从脚下漫开</small></div>
<div id="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 走 · <kbd>Shift</kbd> 跑 · <kbd>空格</kbd> 跳 · 拖动鼠标转视角 · 滚轮远近</div>
<div id="stick" aria-label="移动摇杆"><div id="stick-knob"></div></div>
<button id="jump-btn" aria-label="跳跃">跳</button>
<button id="mode">▶ 自动演示</button>
<button id="replay">↻ 重新开始</button>
<script type="module" src="./js/main.js"></script>
</body>
</html>
