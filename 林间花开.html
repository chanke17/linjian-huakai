<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>林间花开</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f2ede2; --ink: #3a3633; }
  html, body {
    margin: 0; height: 100%; background: var(--paper); overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #title {
    position: fixed; left: 0; right: 0; top: 36%; text-align: center; pointer-events: none;
    font-family: 'ZCOOL XiaoWei', serif; color: var(--ink);
    font-size: clamp(28px, 4.2vw, 56px); letter-spacing: .4em; padding-left: .4em;
    opacity: 0; transition: opacity 1.8s ease;
    text-shadow: 0 0 10px var(--paper), 0 0 22px var(--paper), 0 0 40px var(--paper);
  }
  #title::before {
    content: ""; position: absolute; left: 50%; top: 50%; width: min(70vw, 720px); height: 2.6em;
    transform: translate(-50%, -50%); z-index: -1; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(242, 237, 226, .92), rgba(242, 237, 226, 0));
  }
  #title small { display: block; font-size: .32em; letter-spacing: .6em; margin-top: 1em; opacity: .65; }
  #title.show { opacity: .88; }
  #mode, #replay {
    position: fixed; bottom: calc(16px + env(safe-area-inset-bottom));
    font-family: 'ZCOOL XiaoWei', serif; font-size: 15px; color: var(--ink);
    background: rgba(242, 237, 226, .72); border: 1px solid rgba(58, 54, 51, .3);
    border-radius: 999px; padding: 8px 18px; cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity 1.2s; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    -webkit-tap-highlight-color: transparent;
  }
  #mode { left: 18px; }
  #replay { right: 18px; }
  #mode.show, #replay.show { opacity: 1; pointer-events: auto; }
  #replay:hover, #mode:hover { background: rgba(255, 252, 245, .9); }
  #hint {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom));
    transform: translateX(-50%); pointer-events: none;
    font-family: 'ZCOOL XiaoWei', serif; font-size: 15px; letter-spacing: .12em; color: var(--ink); white-space: nowrap;
    opacity: 0; transition: opacity 1.4s; text-shadow: 0 0 8px var(--paper), 0 0 16px var(--paper);
  }
  #hint.show { opacity: .85; }
  #hint kbd {
    display: inline-block; min-width: 1.4em; padding: 1px 6px; margin: 0 1px; border: 1px solid rgba(58, 54, 51, .45);
    border-bottom-width: 2px; border-radius: 5px; font: inherit; font-size: 13px; background: rgba(242, 237, 226, .8);
  }
  #stick, #jump-btn {
    display: none; position: fixed; z-index: 5; touch-action: none;
    -webkit-tap-highlight-color: transparent; opacity: 0; pointer-events: none; transition: opacity .6s;
  }
  body.touch-ui #stick.show, body.touch-ui #jump-btn.show { display: block; opacity: 1; pointer-events: auto; }
  @media (hover: none) and (pointer: coarse) {
    #stick.show, #jump-btn.show { display: block; opacity: 1; pointer-events: auto; }
  }
  #stick {
    left: 22px; bottom: calc(74px + env(safe-area-inset-bottom));
    width: 112px; height: 112px; border-radius: 50%;
    background: radial-gradient(circle, rgba(242, 237, 226, .45), rgba(242, 237, 226, .22));
    border: 1.5px solid rgba(58, 54, 51, .28);
    box-shadow: 0 2px 12px rgba(58, 54, 51, .08);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  #stick-knob {
    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px;
    margin: -22px 0 0 -22px; border-radius: 50%; pointer-events: none;
    background: rgba(58, 54, 51, .52); border: 1.5px solid rgba(242, 237, 226, .85);
    box-shadow: 0 2px 8px rgba(58, 54, 51, .2);
  }
  #jump-btn {
    right: 24px; bottom: calc(84px + env(safe-area-inset-bottom));
    width: 64px; height: 64px; border-radius: 50%;
    font-family: 'ZCOOL XiaoWei', serif; font-size: 18px; color: var(--ink);
    background: rgba(242, 237, 226, .58); border: 1.5px solid rgba(58, 54, 51, .32);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  #jump-btn:active { transform: scale(.92); background: rgba(242, 237, 226, .85); }
  @media (max-width: 960px) {
    #hint { font-size: 13px; white-space: normal; width: 88vw; text-align: center; bottom: calc(68px + env(safe-area-inset-bottom)); }
  }
  body.touch-ui #hint { top: calc(18px + env(safe-area-inset-top)); bottom: auto; width: 90vw; text-align: center; white-space: normal; font-size: 13px; }
  @media (hover: none) and (pointer: coarse) {
    #hint { top: calc(18px + env(safe-area-inset-top)); bottom: auto; width: 90vw; text-align: center; white-space: normal; font-size: 13px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</head>
<body>
<div id="title">林间花开<small>颜色从脚下漫开</small></div>
<div id="hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 走 · <kbd>Shift</kbd> 跑 · <kbd>空格</kbd> 跳 · 拖动鼠标转视角 · 滚轮远近</div>
<div id="stick" aria-label="移动摇杆"><div id="stick-knob"></div></div>
<button id="jump-btn" aria-label="跳跃">跳</button>
<button id="mode">▶ 自动演示</button>
<button id="replay">↻ 重新开始</button>
<script type="module">
// js/main.js
import * as THREE10 from "three";

// js/materials.js
import * as THREE from "three";

// js/glsl.js
var NOISE = (
  /* glsl */
  `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x),
             mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y);
}
float vnoise3(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash13(i), hash13(i + vec3(1,0,0)), f.x), mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), f.x), mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++){ s += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return s / 0.9375;
}
`
), COMMON = (
  /* glsl */
  `
uniform float uTime;
uniform sampler2D uMask;
uniform vec4 uMaskB;
uniform vec3 uBurstPos;
uniform float uBurstR;
uniform vec3 uSunDir;
uniform vec3 uPaper;
uniform vec3 uHaze;

float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }

// 0 = \u94C5\u7B14\u7EBF\u7A3F\uFF0C1 = \u4E0A\u8272\u3002\u811A\u5370\u906E\u7F69 + \u82B1\u6811\u7206\u53D1\u7684\u7403\u5F62\u6269\u6563\uFF0C\u8FB9\u7F18\u5E26\u6C34\u5F69\u6655\u67D3\u7684\u566A\u58F0
float revealAt(vec3 w){
  vec2 uv = (w.xz - uMaskB.xy) / uMaskB.zw;
  float m = texture2D(uMask, uv).r;
  float n = fbm(w.xz * 0.42 + w.y * 0.25);
  float v = smoothstep(0.43, 0.57, m + (n - 0.5) * 0.6);
  float d = length(w - uBurstPos) + (n - 0.5) * 6.0;
  float b = (1.0 - smoothstep(uBurstR - 2.5, uBurstR, d)) * step(0.001, uBurstR);
  return max(v, b);
}
`
), FRAG = (
  /* glsl */
  `
float hline(float c, float wd){
  float aa = fwidth(c);
  float d = abs(fract(c + 0.5) - 0.5);
  float l = 1.0 - smoothstep(wd * 0.5, wd * 0.5 + aa * 1.2 + 0.001, d);
  l *= smoothstep(0.0, 0.05, wd);
  return mix(l, wd, smoothstep(0.3, 0.75, aa));
}

// \u4E00\u7EC4\u65AD\u7EED\u7684\u94C5\u7B14\u6392\u7EBF\uFF1A\u6BCF\u6839\u7EBF\u6309\u201C\u6697\u5EA6\u201D\u51B3\u5B9A\u51FA\u4E0D\u51FA\u73B0\uFF0C\u6CBF\u7EBF\u65B9\u5411\u518D\u65AD\u6210\u957F\u77ED\u4E0D\u4E00\u7684\u7B14\u89E6
float strokeSet(vec3 w, vec3 dir, vec3 along, float dark, float seed){
  float c = dot(w, dir) * 9.0 + vnoise3(w * 1.1 + seed) * 0.8;
  float k = floor(c + 0.5);
  float d = abs(c - k);
  float aa = fwidth(c);
  float s = dot(w, along) * 1.7 + hash12(vec2(k, seed)) * 7.0;
  float seg = floor(s);
  float amt = clamp(dark * 1.25 - 0.1, 0.0, 1.0);
  float present = step(hash12(vec2(k * 1.37 + seg * 0.71, seed + 3.1)), amt);
  float f = fract(s);
  float gap = smoothstep(0.0, 0.07, f) * smoothstep(1.0, 0.9, f);
  float wd = 0.09 + 0.12 * dark;
  float l = (1.0 - smoothstep(wd * 0.5, wd * 0.5 + aa * 1.2 + 0.001, d)) * present * gap;
  return mix(l, wd * amt, smoothstep(0.3, 0.75, aa));
}

// \u4E24\u7EC4\u6392\u7EBF\uFF1A\u4EAE\u5904\u7A7A\u767D\uFF0C\u6697\u5904\u5355\u6392\u7EBF\uFF0C\u66F4\u6697\u5904\u4EA4\u53C9\u6392\u7EBF
float hatch(vec3 w, vec3 N, float dark){
  vec3 d1 = normalize(vec3(0.62, 0.70, 0.35));
  vec3 d2 = normalize(vec3(-0.58, 0.62, 0.52));
  vec3 a1 = normalize(cross(d1, vec3(0.3, 0.2, 1.0)));
  vec3 a2 = normalize(cross(d2, vec3(1.0, 0.2, 0.3)));
  float h1 = strokeSet(w, d1, a1, dark, 1.0) * (1.0 - smoothstep(0.7, 0.95, abs(dot(N, d1))));
  float h2 = strokeSet(w, d2, a2, (dark - 0.4) * 1.6, 5.0) * (1.0 - smoothstep(0.7, 0.95, abs(dot(N, d2))));
  float g = 0.7 + 0.3 * vnoise3(w * 11.0);
  return max(h1, h2 * 0.9) * g;
}

varying float vT;

// \u5409\u535C\u529B\u5F0F\u7684\u67D4\u548C\u4E0A\u8272\uFF1A\u6696\u5149\u3001\u51B7\u5F71\u3001\u5929\u5149\u8865\u8272\u3001\u8FB9\u7F18\u9006\u5149\u3001\u989C\u6599\u6591\u9A73\uFF1B\u6811\u53F6/\u82B1\u56E2\u52A0\u7B14\u89E6\u6591\u70B9
vec3 painted(vec3 base, vec3 N, vec3 V, vec3 w){
  float ndl = dot(N, uSunDir);
  float fol = 0.0, lf = 3.0;
#ifdef FOLIAGE
  fol = vT;
#endif
#ifdef BLOSSOM
  fol = 1.0; lf = 5.5;
#endif
  float leaf = vnoise3(w * lf) * 0.65 + vnoise3(w * lf * 2.3) * 0.35;
  ndl += (leaf - 0.5) * 0.9 * fol;
  float lit = smoothstep(-0.22, 0.48, ndl);
#ifdef ALWAYS
  // \u89D2\u8272\uFF1A\u4ECE\u955C\u5934\u65B9\u5411\u8865\u4E00\u70B9\u67D4\u5149\uFF0C\u6697\u90E8\u504F\u6696\uFF0C\u4EFB\u4F55\u89D2\u5EA6\u770B\u90FD\u6E05\u695A
  lit = max(lit, clamp(dot(N, V), 0.0, 1.0) * 0.6);
  vec3 sh = base * vec3(0.80, 0.70, 0.74);
  vec3 li = base * vec3(1.06, 1.02, 0.96);
#elif defined(BLOSSOM)
  vec3 sh = base * vec3(0.88, 0.68, 0.74);
  vec3 li = base * vec3(1.05, 1.02, 1.0) + vec3(0.05, 0.04, 0.04);
#else
  vec3 sh = base * vec3(0.52, 0.60, 0.82);
  vec3 li = base * vec3(1.10, 1.04, 0.90);
#endif
  vec3 c = mix(sh, li, lit);
  c += vec3(0.04, 0.06, 0.09) * (N.y * 0.5 + 0.5);
  float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
  c += vec3(1.0, 0.9, 0.7) * rim * 0.10 * (0.4 + lit);
  float fl1 = smoothstep(0.76, 0.84, vnoise3(w * lf * 3.1));
  float fl2 = smoothstep(0.78, 0.86, vnoise3(w * lf * 2.7 + 9.0));
  c = mix(c, li * 1.12 + 0.03, fl1 * lit * 0.55 * fol);
  c = mix(c, sh * 0.82, fl2 * (1.0 - lit) * 0.6 * fol);
  float pn = fbm(w.xz * 1.3 + w.y * 0.9);
  c *= 0.9 + 0.2 * pn;
  return c;
}

vec3 sketched(vec3 base, vec3 N, vec3 w){
  float ndl = dot(N, uSunDir);
  float tone = smoothstep(-0.35, 0.65, ndl);
  float dark = clamp((1.0 - tone) * 0.8 + (0.45 - lum(base)) * 0.7, 0.0, 1.0);
  float h = hatch(w, N, dark);
  return uPaper * (1.0 - h * 0.55) * (1.0 - dark * 0.06);
}

// \u6DF7\u5408\u7EBF\u7A3F\u4E0E\u4E0A\u8272\uFF1A\u4EA4\u754C\u5904\u52A0\u4E00\u5708\u6C34\u5F69\u79EF\u8272\uFF0C\u518D\u53E0\u7A7A\u6C14\u900F\u89C6
vec3 finish(vec3 sk, vec3 cc, float r, vec3 w){
  float rim = r * (1.0 - r) * 4.0;
  cc *= 1.0 - rim * 0.22;
  vec3 c = mix(sk, cc, r);
  float d = length(w - cameraPosition);
  float f = (1.0 - exp(-max(d - 14.0, 0.0) * 0.024)) * 0.9;
  return mix(c, mix(uPaper, uHaze, r), f);
}
`
);

// js/materials.js
var U = {
  uTime: { value: 0 },
  uMask: { value: null },
  uMaskB: { value: new THREE.Vector4() },
  uBurstPos: { value: new THREE.Vector3() },
  uBurstR: { value: 0 },
  uSunDir: { value: new THREE.Vector3(-0.55, 0.72, 0.42).normalize() },
  uPaper: { value: new THREE.Color(0.95, 0.935, 0.9) },
  uHaze: { value: new THREE.Color(0.74, 0.84, 0.83) },
  uSky: { value: 0 },
  uGirl: { value: new THREE.Vector4(0, 0, 9, 0) },
  uBloom: { value: 0 },
  uTree: { value: new THREE.Vector3() },
  uPetalT: { value: -1 },
  uGroundMin: { value: -1 }
}, UBER_VS = (
  /* glsl */
  `
attribute vec3 aCol;
attribute float aTint;
uniform float uWind;
uniform float uBloom;
uniform vec4 uCloak;
uniform vec2 uCloakY;
varying vec3 vW; varying vec3 vN; varying vec3 vC; varying float vT;
void main(){
  vec3 p = position;
  vT = aTint;
  vec3 col = aCol;
#ifdef USE_INSTANCING_COLOR
  col = mix(col, col * instanceColor, aTint);
#endif
  mat4 im = mat4(1.0);
#ifdef USE_INSTANCING
  im = instanceMatrix;
#endif
#ifdef BLOSSOM
  float seed = fract(sin(dot(im[3].xyz, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
  float b = clamp((uBloom - seed * 0.45) / 0.55, 0.0, 1.0);
  p *= 0.5 + 0.5 * b + sin(b * 3.14159) * 0.22;
#endif
#ifdef FLOWER
  vec3 w0 = (modelMatrix * im * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
  float fr = revealAt(w0);
  float open = mix(0.4, 1.0, fr) + sin(fr * 3.14159) * 0.25;
  if (aTint > 0.5) { p.xz *= open; p.y += (1.0 - fr) * 0.012; }
#endif
#ifdef GRASS
  // \u7EBF\u7A3F\u91CC\u7684\u8349\u53C8\u7A00\u53C8\u77EE\uFF1B\u989C\u8272\u6F2B\u5230\u65F6\u4E00\u4E0B\u5B50\u957F\u9AD8
  vec3 g0 = (modelMatrix * im * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
  float gr = revealAt(g0);
  float keep = step(0.5, fract(sin(dot(g0.xz, vec2(12.9898, 78.233))) * 43758.5453));
  float grow = mix(0.38 * keep, 1.0, gr) + sin(gr * 3.14159) * 0.12;
  p.y *= grow; p.z *= grow;
#endif
#ifdef CLOAK
  float f = smoothstep(uCloakY.x, uCloakY.y, p.y);
  p.z -= uCloak.x * f * f * 0.16;
  p.x += sin(uCloak.w + p.y * 9.0) * uCloak.y * f * 0.03;
  p.z += sin(uCloak.w * 2.0 + atan(p.x, p.z) * 3.0) * uCloak.y * f * 0.02;
#endif
  vec4 wp = modelMatrix * im * vec4(p, 1.0);
#ifdef WIND
  float hh = max(p.y, 0.0);
  float ph = uTime * 1.6 + wp.x * 0.21 + wp.z * 0.17;
  float g = sin(ph) + 0.5 * sin(ph * 2.3 + 1.0);
  wp.x += g * uWind * hh * hh;
  wp.z += cos(ph * 0.7) * uWind * hh * hh * 0.6;
#endif
  vW = wp.xyz;
  vN = normalize(mat3(modelMatrix) * mat3(im) * normal);
  vC = col;
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`
), UBER_FS = (
  /* glsl */
  `
varying vec3 vW; varying vec3 vN; varying vec3 vC;
void main(){
  vec3 N = normalize(vN);
#ifndef NOFLIP
  N = gl_FrontFacing ? N : -N;
#endif
  float r = revealAt(vW);
#ifdef ALWAYS
  r = 1.0;
#endif
  vec3 V = normalize(cameraPosition - vW);
  vec3 cc = painted(vC, N, V, vW);
  vec3 sk = sketched(vC, N, vW);
  gl_FragColor = vec4(finish(sk, cc, r, vW), 1.0);
}
`
);
function uberMat(opt = {}) {
  let defines = {};
  for (let k of ["always", "wind", "blossom", "cloak", "flower", "noflip", "foliage", "grass"]) opt[k] && (defines[k.toUpperCase()] = 1);
  return new THREE.ShaderMaterial({
    defines,
    side: opt.side ?? THREE.FrontSide,
    uniforms: { ...U, uWind: { value: opt.wind || 0 }, uCloak: { value: new THREE.Vector4() }, uCloakY: { value: new THREE.Vector2(1.02, 0.45) } },
    vertexShader: NOISE + COMMON + UBER_VS,
    fragmentShader: NOISE + COMMON + FRAG + UBER_FS
  });
}
var SIMPLE_VS = (
  /* glsl */
  `
varying vec3 vW; varying vec3 vN;
void main(){
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vW = wp.xyz; vN = normalize(mat3(modelMatrix) * normal);
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`
), PATHFN = (
  /* glsl */
  `
float pathX(float z){ return sin(z * 0.08) * 2.6 + sin(z * 0.21 + 1.3) * 0.7; }
float streamZ(float x){ return sin(x * 0.12) * 1.8 + sin(x * 0.31 + 2.0) * 0.5; }
`
), GROUND_FS = (
  /* glsl */
  `
uniform vec4 uGirl; uniform float uBloom; uniform vec3 uTree;
varying vec3 vW; varying vec3 vN;
void main(){
  vec3 N = normalize(vN); vec3 w = vW;
  float n1 = fbm(w.xz * 0.25), n2 = fbm(w.xz * 1.7 + 3.1);
  float dpRaw = abs(w.x - pathX(w.z));
  float dp = dpRaw + (n2 - 0.5) * 0.5;
  float onPath = 1.0 - smoothstep(0.9, 1.25, dp);
  float dsRaw = abs(w.z - streamZ(w.x));
  float ds = dsRaw + (n2 - 0.5) * 0.4;
  float bank = 1.0 - smoothstep(1.7, 2.7, ds);
  vec3 grass = mix(vec3(0.29, 0.49, 0.21), vec3(0.56, 0.70, 0.30), n1);
